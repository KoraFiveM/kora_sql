name: Performance Issue
description: Report a slowdown or high resource usage in kora_sql.
title: '[Performance]: '
labels:
- performance
- needs-triage
body:
- type: input
  id: resource
  attributes:
    label: Affected component
    placeholder: For example, Query execution, Write coalescing, Driver compatibility, Connection and transactions
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: kora_sql version or commit
  validations:
    required: true
- type: textarea
  id: impact
  attributes:
    label: Performance impact
    description: Include query or transaction timings, typical and affected row counts, and sanitized profiling data.
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: Steps to reproduce
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment and profiling evidence
    description: Include the database engine and version, server artifacts, and sanitized logs or query plans.
