name: Bug report
description: Report something that is not working in kora_sql.
title: '[Bug]: '
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first and report one problem at a time. Remove passwords, tokens,
        connection strings and player identifiers from text and attachments. For a suspected
        vulnerability, use the repository Security tab or its security policy instead of a public
        issue.
  - type: dropdown
    id: version
    attributes:
      label: Resource version
      description: >-
        Select your installed kora_sql version (check fxmanifest.lua if unsure). For a development
        build or another version, add the version/commit under Technical details.
      options:
        - v0.2.1
        - v0.2.0
        - v0.1.0
        - Development / unreleased
        - Other version
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - Query execution
        - Write coalescing
        - Driver compatibility
        - Connection and transactions
        - Other / not sure
  - type: textarea
    id: problem
    attributes:
      label: Describe the issue in detail.
      description: >-
        Describe what happens in kora_sql. Name the native or compatibility API and calling
        resource. Include database engine/version, error code and a query with example parameters;
        remove connection strings.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant F8 error or log (optional)
      description: >-
        Provide F8/client or server console errors and say which console they came from. Remove
        secrets and player data.
      render: text
  - type: textarea
    id: steps
    attributes:
      label: What are the steps to reproduce the issue?
      description: >-
        List what you did in order, including any required job, items or location. If it happens
        only sometimes, say how often and whether it follows a reconnect or resource restart.
      placeholder: |-
        1. Start kora_sql and the resource that makes the failing database call.
        2. Trigger the action in the calling resource that runs the affected query or database operation.
        3. Describe what happens and when the issue starts.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: What is the expected behavior?
      description: >-
        Explain what kora_sql should do when you follow those steps, including any expected changes
        to the player, UI or server state.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Technical details (optional)
      description: >-
        Include your exact version/commit if you selected a development build or another version,
        FXServer artifact/game build, relevant dependency versions and custom changes if known. Do
        not paste your full server.cfg.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video (optional)
      description: >-
        Drag in an image or add a clip link if it helps show the problem. Check attachments for
        private information.
